name: Bug report
description: Report a DonutMail bug
labels: [bug]
body:
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software / MC version
      placeholder: Paper 26.3
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
