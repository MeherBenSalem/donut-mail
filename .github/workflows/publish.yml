# Dual-publish DonutMail to Modrinth + CurseForge on version tags.
#
# Secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Variables (defaults applied in workflow if unset):
#   MODRINTH_ID   (a4rA3S9T)
#   CURSEFORGE_ID (1480575)
#
# Usage: git tag v1.1.0 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find target -maxdepth 1 -type f -name 'donut-mail-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' | head -n 20)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars in target/" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          MODRINTH_ID="${MODRINTH_ID:-a4rA3S9T}"
          CURSEFORGE_ID="${CURSEFORGE_ID:-1480575}"
          export MODRINTH_ID CURSEFORGE_ID
          test -n "${MODRINTH_ID}" && test -n "${CURSEFORGE_ID}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          const loaders = ['paper', 'purpur', 'folia'];
          const gvs = ['26.1.2', '26.2', '26.3'];

          function resolveCfVersion(flat, want) {
            const exact = flat.find((v) => v.name === want);
            if (exact) return exact.id;
            const parts = want.split('.');
            if (parts.length >= 2) {
              const majorMinor = parts[0] + '.' + parts[1];
              const mm = flat.find((v) => v.name === majorMinor);
              if (mm) return mm.id;
            }
            const prefix = flat.find((v) => v.name === want || v.name.startsWith(want + '.'));
            if (prefix) return prefix.id;
            return null;
          }

          (async () => {
            const fileParts = jars.map((_, i) => `file_${i}`);
            const body = {
              name: version,
              version_number: version,
              changelog: `Release ${version}`,
              dependencies: [],
              game_versions: gvs,
              version_type: 'release',
              loaders,
              featured: false,
              status: 'listed',
              project_id: process.env.MODRINTH_ID,
              file_parts: fileParts,
              primary_file: fileParts[0],
            };
            const form = new FormData();
            form.append('data', JSON.stringify(body));
            for (let i = 0; i < jars.length; i++) {
              form.append(fileParts[i], new Blob([fs.readFileSync(jars[i])]), path.basename(jars[i]));
            }
            const mrRes = await fetch('https://api.modrinth.com/v2/version', {
              method: 'POST',
              headers: { Authorization: process.env.MODRINTH_TOKEN },
              body: form,
            });
            const mrText = await mrRes.text();
            if (mrRes.ok) {
              console.log('Modrinth OK', mrText.slice(0, 180));
            } else if (mrRes.status === 400 && /already exists|duplicate/i.test(mrText)) {
              console.log('Modrinth version already exists; continuing to CurseForge');
            } else {
              throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
            }

            const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
              headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
            });
            const gvJson = await gvRes.json();
            const flat = [];
            for (const g of gvJson.data || []) for (const v of g.versions || []) flat.push(v);
            const gameVersionIds = [];
            const seen = new Set();
            for (const want of gvs) {
              const id = resolveCfVersion(flat, want);
              if (!id) {
                console.warn('Skipping unknown CF game version', want);
                continue;
              }
              if (!seen.has(id)) {
                seen.add(id);
                gameVersionIds.push(id);
              }
            }
            if (!gameVersionIds.length) {
              throw new Error('No CurseForge game versions resolved from ' + gvs.join(','));
            }
            console.log('CF gameVersionIds', gameVersionIds.join(','));

            for (const jar of jars) {
              const meta = {
                changelog: `Release ${version}`,
                changelogType: 'markdown',
                displayName: path.basename(jar),
                gameVersions: gameVersionIds,
                releaseType: 1,
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', path.basename(jar), cfText.slice(0, 180));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
