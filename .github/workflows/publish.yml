# Publish DonutMail to CurseForge on version tags (NightBeam convention: CurseForge only since 24 Nov 2026).
# One jar (DonutMail-<version>.jar), tagged with every Minecraft version in
# release/supported-minecraft.json. The changelog is DonutMail-<version>-PatchNotes.md when present.
#
# Secrets:
#   CURSEFORGE_TOKEN    (upload)
#   CURSEFORGE_API_KEY  (Core API, for the same-day guard)
#
# Variable (default applied in workflow if unset):
#   CURSEFORGE_ID (1480575)
#
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Usage: git tag v2.0.0 && git push --tags
#
# Runs only on a v*.*.* tag or by hand; a push to main never releases anything.
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if DonutMail already had a release
# today (Africa/Tunis day), on CurseForge or in an earlier Publish run of this repo. It runs first and again right
# before the upload; a dry run only reports.
# Prove it first: gh workflow run publish.yml -f version=<version> -f dry_run=true

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1480575' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --test scripts/same_day_guard.test.mjs
          node scripts/same_day_guard.mjs

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find target -maxdepth 1 -type f -name 'DonutMail-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' | head -n 20)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars in target/" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1480575' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          CURSEFORGE_ID="${CURSEFORGE_ID:-1480575}"
          export CURSEFORGE_ID
          test -n "${CURSEFORGE_ID}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          const supported = JSON.parse(fs.readFileSync('release/supported-minecraft.json', 'utf8'));
          const gvs = supported.game_versions;
          const notesFile = `DonutMail-${version}-PatchNotes.md`;
          const changelog = fs.existsSync(notesFile) ? fs.readFileSync(notesFile, 'utf8') : `Release ${version}`;

          (async () => {
            for (const jar of jars) {
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: path.basename(jar),
                // Minecraft versions plus the server platforms, as DonutRTP's plugin uploads tag them.
                gameVersionNames: [...gvs, 'Paper', 'Purpur', 'Folia', 'Server'],
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', path.basename(jar), cfText.slice(0, 180));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
