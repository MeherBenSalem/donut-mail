# NightBeam plugin CI: unit tests and the storage contract (YAML, SQLite, MySQL); the plugin.yml / bStats / Java 17
# check; and smoke boots on real servers (Paper 1.20.1, Paper 26.3 and the newest Folia).
# The live matrix with network clients is tools/smoke (run by hand).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: donutmail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Unit tests, storage contract and races on YAML, SQLite and MySQL
        run: >-
          mvn -B test
          '-Ddonutmail.test.mysql.url=jdbc:mysql://127.0.0.1:3306/donutmail_test?useSSL=false&allowPublicKeyRetrieval=true'
          -Ddonutmail.test.mysql.user=root -Ddonutmail.test.mysql.password=test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publisher script tests (same-day guard)
        run: node --test scripts/*.test.mjs
      - name: Package
        run: mvn -B -q -DskipTests package
      - name: Check plugin.yml, bStats ID and Java 17 bytecode
        run: python3 scripts/check_plugin_yml.py --jar "$(ls target/DonutMail-*.jar | grep -v original- | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: DonutMail-jar
          path: target/DonutMail-*.jar
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 1.20.1
            project: paper
            version: "1.20.1"
            java: "17"
          - name: Paper 26.3
            project: paper
            version: "26.3"
            java: "25"
          - name: Folia (newest)
            project: folia
            version: latest
            java: "25"
    name: Smoke ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DonutMail-jar
          path: artifact
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Boot ${{ matrix.name }}
        env:
          JAVA_BIN: ${{ steps.java.outputs.path }}/bin/java
        run: scripts/smoke_boot.sh ${{ matrix.project }} ${{ matrix.version }} "$(ls artifact/DonutMail-*.jar | grep -v original- | head -1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.project }}-${{ matrix.version }}
          path: build/smoke/*/server.log
          if-no-files-found: ignore
