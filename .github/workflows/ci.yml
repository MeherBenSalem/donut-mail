name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: donutmail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Unit tests, storage contract and races on YAML, SQLite and MySQL
        run: >-
          mvn -B test
          '-Ddonutmail.test.mysql.url=jdbc:mysql://127.0.0.1:3306/donutmail_test?useSSL=false&allowPublicKeyRetrieval=true'
          -Ddonutmail.test.mysql.user=root -Ddonutmail.test.mysql.password=test

      - name: Package
        run: mvn -B -DskipTests package
