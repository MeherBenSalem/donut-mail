# ─────────────────────────────────────────────────────────────────────────────
#  DonutMail configuration
#
#  New settings are added to this file when the server starts; your values are kept.
#  Reload with /mail reload (storage and network settings need a restart).
#  Text players read lives in messages.yml, menus in gui.yml, the daily calendar in daily.yml.
# ─────────────────────────────────────────────────────────────────────────────

storage:
  # YAML (small servers), SQLITE (one server) or MYSQL (one or several servers sharing mail).
  # Changing it needs a restart. Mail is not copied between storage types.
  type: SQLITE
  mysql:
    host: localhost
    port: 3306
    database: donutmail
    username: root
    password: change_me
    pool-size: 10
    parameters: useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC

# Several servers sharing one MySQL database: mail sent on one reaches players on the others.
network:
  # A name for this server in the audit log and claim locks. Empty = generated once and kept in data/server-id.txt.
  server-id: ''
  # How often to look for mail sent from other servers (MySQL storage).
  poll-interval-seconds: 3

mail:
  # Server mail (deliveries, campaigns, rewards, messages) expires after this many days. 0 = never.
  expire-days: 30
  # How often expired mail and parcels are processed.
  expiry-scan-seconds: 60
  # Mail older than this many days in the Sent and history lists is deleted automatically. 0 = keep.
  history-retention-days: 60

parcels:
  enabled: true
  # Unclaimed parcels expire after this many days. 0 = never.
  expire-days: 7
  # Expired or declined parcels go back to the sender. When false they are deleted (logged in the audit log).
  return-to-sender: true
  # Senders may take back a parcel that was not claimed or paid yet (Sent tab).
  allow-recall: true
  allow-self: false
  # Anti-spam. Bypass: donutmail.bypass.limits
  cooldown-seconds: 10
  max-per-day: 30
  # Parcels from one sender waiting in one mailbox.
  max-pending-per-recipient: 5
  # Parcels a mailbox can hold from all senders together.
  mailbox-capacity: 54
  note-max-length: 120
  # Items that can never be sent in a parcel.
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, DEBUG_STICK, LIGHT, STRUCTURE_VOID]
  # Optional fee to send a parcel (needs Vault). Exempt: donutmail.postage.exempt
  postage:
    enabled: false
    flat: 0
    per-stack: 0

# Cash on delivery: the sender sets a price, the recipient previews the items and pays to accept or declines.
cash-on-delivery:
  enabled: true
  min-price: 1
  max-price: 1000000000
  # Percent of the price kept by the server (0 = the sender gets everything).
  tax-percent: 0

claims:
  # When an inventory is full the rest stays in the mailbox. Set true to drop it at the player's feet instead.
  drop-overflow: false

notifications:
  # Summary when a player joins, with a clickable "open mailbox".
  join-summary: true
  join-delay-seconds: 2
  # Tell online players right away when mail arrives (also from other servers).
  live: true
  chat: true
  title: true
  action-bar: true
  sound: true
  sound-key: 'minecraft:entity.experience_orb.pickup'

# Tell everyone online when a campaign starts.
campaigns:
  announce: true
  # Players need this to see campaigns. Empty = everyone.
  permission: ''

# Reward codes: /mail redeem <code>
codes:
  enabled: true
  # Seconds between two attempts by one player (stops guessing).
  attempt-cooldown-seconds: 3

# Vote rewards through the mailbox (needs NuVotifier).
votes:
  enabled: false
  message: '<green>Thanks for voting on <white>%service%</white>!'
  money: 0
  items: []          # e.g. ['DIAMOND:2', 'EXPERIENCE_BOTTLE:16']
  commands: []       # run by the console when claimed; %player% and %uuid% are replaced
  voucher: ''

# Post new campaigns to a Discord channel (Channel settings > Integrations > Webhooks).
discord:
  enabled: false
  webhook-url: ''
  username: 'Server Mail'
  avatar-url: ''
  color: '#F5A623'

# Right-click one of these blocks (for example a lectern at spawn) to open the mailbox.
# Add the block you look at with /mail admin setblock, remove it with /mail admin removeblock.
mailbox-blocks:
  enabled: true
  locations: []

# A line per send, claim, payment, return and redeem in plugins/DonutMail/logs/audit-YYYY-MM-DD.log (UTC).
audit:
  enabled: true

# Sound keys (namespace:path), optionally followed by :volume:pitch. Use "none" to mute one.
sounds:
  enabled: true
  click: 'minecraft:ui.button.click:0.4:1.2'
  claim: 'minecraft:entity.item.pickup:0.7:1.0'
  send: 'minecraft:entity.experience_orb.pickup:0.6:1.3'
  paid: 'minecraft:entity.player.levelup:0.5:1.6'
  error: 'minecraft:entity.villager.no:0.6:1.0'
  page: 'minecraft:item.book.page_turn:0.6:1.0'

placeholderapi:
  enabled: true
