# ─────────────────────────────────────────────────────────────────────────────
#  DonutMail  –  messages.yml
#
#  Everything DonutMail says in chat, titles and the action bar. Menus are in gui.yml.
#  Edit and run /mail reload. New messages are added to this file automatically.
#
#  Formatting (mix freely):
#    &0–&f, &l, &o, &n, &m, &k, &r     legacy codes
#    &#RRGGBB                           hex colors
#    <gold>, <#ffaa00>, <gradient:#f9d423:#ff4e50>text</gradient>, <bold>   MiniMessage
#    <click:run_command:'/mail'>text</click>, <hover:show_text:'tip'>text</hover>
#  Inside <click> and <hover> use MiniMessage colors (a legacy &-code resets and would end the click).
#
#  Placeholders like %player% are inserted as plain text: names and notes typed by players can never
#  add colors or click events.
# ─────────────────────────────────────────────────────────────────────────────

